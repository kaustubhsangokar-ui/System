<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The System" />
    <meta name="application-name" content="The System" />
    <meta name="description" content="Level up your life with RPG stats, quests, habits, and progress tracking." />
    <link rel="manifest" href="/manifest.json" />
    <title>The System - RPG Growth Tracker</title>
  </head>
  <body class="bg-slate-950 text-slate-100 selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('The System PWA ServiceWorker registered successfully:', reg.scope);
          }).catch((err) => {
            console.warn('ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
